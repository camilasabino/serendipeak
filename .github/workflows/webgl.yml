name: WebGL

# The real-WebGL suites are slow and sensitive to renderer timing, so they never run on pushes or
# pull requests and are not a required check. Production runs every scenario in two shards;
# development runs only the scenarios tagged @lifecycle, which exist for React Strict Mode and the
# Viewer lifecycle. Scheduled runs use the default branch (Mondays, 06:00 UTC); a manual run uses
# the branch chosen in the dispatch form.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Each job is its own runner with its own checkout, build directory, dev or production server and
  # stub API, so nothing is shared between jobs or between modes.
  webgl:
    name: WebGL ${{ matrix.mode }} ${{ matrix.shard_index }}/${{ matrix.shard_total }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: development
            script: test:webgl
            shard_index: 1
            shard_total: 1
            grep: "@lifecycle"
          - mode: production
            script: test:webgl:prod
            shard_index: 1
            shard_total: 2
            grep: ""
          - mode: production
            script: test:webgl:prod
            shard_index: 2
            shard_total: 2
            grep: ""
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: WebGL scene tests (${{ matrix.mode }})
        env:
          SCRIPT: ${{ matrix.script }}
          SHARD: ${{ matrix.shard_index }}/${{ matrix.shard_total }}
          GREP: ${{ matrix.grep }}
          PLAYWRIGHT_JSON_OUTPUT_NAME: ${{ runner.temp }}/webgl-${{ matrix.mode }}-${{ matrix.shard_index }}.json
        run: npm run "$SCRIPT" -- --shard="$SHARD" --reporter=list,json ${GREP:+--grep "$GREP"}

      - name: Upload failure traces
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: webgl-traces-${{ matrix.mode }}-${{ matrix.shard_index }}
          path: apps/web/test-results
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload duration report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: webgl-report-${{ matrix.mode }}-${{ matrix.shard_index }}
          path: ${{ runner.temp }}/webgl-${{ matrix.mode }}-${{ matrix.shard_index }}.json
          if-no-files-found: warn
          retention-days: 14

  # Fails when a test was run twice, a development test is not tagged @lifecycle, or a @lifecycle
  # test did not run in development, which the individual shards cannot see.
  webgl-result:
    name: WebGL
    needs: webgl
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: scripts

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Download duration reports
        id: download
        uses: actions/download-artifact@v8
        with:
          pattern: webgl-report-*
          path: ${{ runner.temp }}/webgl-reports
          merge-multiple: true

      - name: Summarize durations and check coverage
        id: summary
        run: node scripts/playwright-summary.mjs "$RUNNER_TEMP/webgl-reports" >> "$GITHUB_STEP_SUMMARY"

      # Fails closed: a failed, cancelled or skipped shard, or a report step that did not succeed,
      # fails the run.
      - name: Require the WebGL result
        if: ${{ always() }}
        env:
          WEBGL_RESULT: ${{ needs.webgl.result }}
          DOWNLOAD_OUTCOME: ${{ steps.download.outcome }}
          SUMMARY_OUTCOME: ${{ steps.summary.outcome }}
        run: |
          if [ "$WEBGL_RESULT" != "success" ] || [ "$DOWNLOAD_OUTCOME" != "success" ] || [ "$SUMMARY_OUTCOME" != "success" ]; then
            echo "WebGL suites: shards=$WEBGL_RESULT reports=$DOWNLOAD_OUTCOME coverage=$SUMMARY_OUTCOME"
            exit 1
          fi
