name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commitlint:
    name: Commit messages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint pull request commits
        if: github.event_name == 'pull_request'
        run: npx --no -- commitlint --from "${{ github.event.pull_request.base.sha }}" --to "${{ github.event.pull_request.head.sha }}" --verbose

      - name: Lint pushed commits
        if: github.event_name == 'push'
        run: |
          before="${{ github.event.before }}"
          if git cat-file -e "${before}^{commit}" 2>/dev/null; then
            npx --no -- commitlint --from "$before" --to "${{ github.sha }}" --verbose
          else
            npx --no -- commitlint --last --verbose
          fi

  contracts:
    name: Contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Verify frozen contract integrity
        run: node scripts/contracts-verify.mjs

  api:
    name: API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    env:
      DATABASE_URL: postgres://serendipeak:serendipeak@localhost:5432/serendipeak
      APP_ENV: development
      DJANGO_SECRET_KEY: ci-only-insecure-secret-key
      ALLOWED_HOSTS: localhost,127.0.0.1
      CORS_ALLOWED_ORIGIN: http://localhost:3000
      WEB_ORIGIN: http://localhost:3000
      PREVIEW_SIGNING_KEY: ci-only-insecure-preview-signing-key
      MEDIA_STORE: filesystem
      MEDIA_ROOT: .media
      MEDIA_PUBLIC_BASE_URL: http://localhost:8000/media
    services:
      postgres:
        image: postgis/postgis:18-3.6
        env:
          POSTGRES_USER: serendipeak
          POSTGRES_PASSWORD: serendipeak
          POSTGRES_DB: serendipeak
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U serendipeak -d serendipeak"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5

      - name: Install GDAL and GEOS
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gdal-bin libgdal-dev libgeos-dev

      - uses: astral-sh/setup-uv@v7
        with:
          python-version-file: .python-version
          enable-cache: true
          cache-dependency-glob: services/api/uv.lock

      - name: Install dependencies
        run: uv sync --locked

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Django system checks
        run: uv run python manage.py check

      # Boots the settings, URL configuration and composition with production values and the S3
      # media store. Every value is a placeholder: `check` neither connects to the database nor
      # contacts the object store, and needs no catalog.
      - name: Django system checks (production settings)
        env:
          APP_ENV: production
          ALLOWED_HOSTS: api.example.com,healthcheck.railway.app
          CORS_ALLOWED_ORIGIN: https://web.example.com
          WEB_ORIGIN: https://web.example.com
          TRUSTED_PROXY_HOPS: "1"
          MEDIA_STORE: s3
          MEDIA_PUBLIC_BASE_URL: https://media.example.com
          MEDIA_S3_ENDPOINT_URL: https://objects.example.com
          MEDIA_S3_ACCESS_KEY_ID: ci-only-access-key-id
          MEDIA_S3_SECRET_ACCESS_KEY: ci-only-secret-access-key
          MEDIA_PUBLIC_BUCKET: ci-public
          MEDIA_ORIGINALS_BUCKET: ci-originals
        run: uv run python manage.py check

      - name: Check migrations are in sync
        run: uv run python manage.py makemigrations --check --dry-run

      - name: Apply migrations
        run: uv run python manage.py migrate --noinput

      - name: Test
        run: uv run pytest

  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Production gate
        run: npm run check:production-gate

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: SSR HTTP tests
        run: npm run test:ssr

      - name: Stage failure tests (no WebGL)
        run: npm run test:nogl

  # Pushes and pull requests that change only documentation skip the WebGL suites. Everything else
  # runs them: the classifier treats any path or event it does not recognise as relevant.
  changes:
    name: Changes
    runs-on: ubuntu-latest
    outputs:
      webgl: ${{ steps.classify.outputs.webgl }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Test the CI and backup scripts
        run: node --test "scripts/*.test.mjs" "services/backup/test/*.test.mjs"

      - name: Decide whether the WebGL suites run
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/classify-changes.mjs "$EVENT_NAME" "$BASE_SHA" "$HEAD_SHA" >> "$GITHUB_OUTPUT"

  # Each shard is its own runner with its own checkout, build directory, dev or production server
  # and stub API, so nothing is shared between shards or between modes.
  webgl:
    name: WebGL ${{ matrix.mode }} ${{ matrix.shard_index }}/${{ matrix.shard_total }}
    needs: changes
    if: needs.changes.outputs.webgl == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/web
    strategy:
      fail-fast: false
      matrix:
        mode: [development, production]
        shard_index: [1, 2]
        shard_total: [2]
        include:
          - mode: development
            script: test:webgl
          - mode: production
            script: test:webgl:prod
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: WebGL scene tests (${{ matrix.mode }})
        env:
          SCRIPT: ${{ matrix.script }}
          SHARD: ${{ matrix.shard_index }}/${{ matrix.shard_total }}
          PLAYWRIGHT_JSON_OUTPUT_NAME: ${{ runner.temp }}/webgl-${{ matrix.mode }}-${{ matrix.shard_index }}.json
        run: npm run "$SCRIPT" -- --shard="$SHARD" --reporter=list,json

      - name: Upload duration report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: webgl-report-${{ matrix.mode }}-${{ matrix.shard_index }}
          path: ${{ runner.temp }}/webgl-${{ matrix.mode }}-${{ matrix.shard_index }}.json
          if-no-files-found: warn
          retention-days: 14

  # One stable check for the whole matrix: a skipped matrix job reports under its unexpanded name,
  # which a required check could never match. It also fails when a test was run twice, or in one
  # mode only, which the individual shards cannot see.
  webgl-result:
    name: WebGL
    needs: [changes, webgl]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: scripts

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Download duration reports
        id: download
        if: needs.changes.outputs.webgl == 'true'
        uses: actions/download-artifact@v8
        with:
          pattern: webgl-report-*
          path: ${{ runner.temp }}/webgl-reports
          merge-multiple: true

      - name: Summarize durations and check coverage
        id: summary
        if: needs.changes.outputs.webgl == 'true'
        run: node scripts/playwright-summary.mjs "$RUNNER_TEMP/webgl-reports" >> "$GITHUB_STEP_SUMMARY"

      # Fails closed: only the two outcomes below pass. An unexpected classification, a failed,
      # cancelled or skipped shard, or a report step that did not succeed all fail the check.
      - name: Require the WebGL result
        if: ${{ always() }}
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          WEBGL_REQUIRED: ${{ needs.changes.outputs.webgl }}
          WEBGL_RESULT: ${{ needs.webgl.result }}
          DOWNLOAD_OUTCOME: ${{ steps.download.outcome }}
          SUMMARY_OUTCOME: ${{ steps.summary.outcome }}
        run: |
          if [ "$CHANGES_RESULT" != "success" ]; then
            echo "Change classification finished with: $CHANGES_RESULT"
            exit 1
          fi

          case "$WEBGL_REQUIRED" in
            true)
              if [ "$WEBGL_RESULT" != "success" ] || [ "$DOWNLOAD_OUTCOME" != "success" ] || [ "$SUMMARY_OUTCOME" != "success" ]; then
                echo "WebGL suites: shards=$WEBGL_RESULT reports=$DOWNLOAD_OUTCOME coverage=$SUMMARY_OUTCOME"
                exit 1
              fi
              ;;
            false)
              if [ "$WEBGL_RESULT" != "skipped" ]; then
                echo "WebGL suites were not required but finished with: $WEBGL_RESULT"
                exit 1
              fi
              echo "WebGL suites skipped: the change touches only documentation." >> "$GITHUB_STEP_SUMMARY"
              ;;
            *)
              echo "Unexpected classification: '$WEBGL_REQUIRED'"
              exit 1
              ;;
          esac
