name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commitlint:
    name: Commit messages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint pull request commits
        if: github.event_name == 'pull_request'
        run: npx --no -- commitlint --from "${{ github.event.pull_request.base.sha }}" --to "${{ github.event.pull_request.head.sha }}" --verbose

      - name: Lint pushed commits
        if: github.event_name == 'push'
        run: |
          before="${{ github.event.before }}"
          if git cat-file -e "${before}^{commit}" 2>/dev/null; then
            npx --no -- commitlint --from "$before" --to "${{ github.sha }}" --verbose
          else
            npx --no -- commitlint --last --verbose
          fi

  contracts:
    name: Contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Verify frozen contract integrity
        run: node scripts/contracts-verify.mjs

  api:
    name: API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    env:
      DATABASE_URL: postgres://serendipeak:serendipeak@localhost:5432/serendipeak
      APP_ENV: development
      DJANGO_SECRET_KEY: ci-only-insecure-secret-key
      ALLOWED_HOSTS: localhost,127.0.0.1
      CORS_ALLOWED_ORIGIN: http://localhost:3000
      WEB_ORIGIN: http://localhost:3000
      PREVIEW_SIGNING_KEY: ci-only-insecure-preview-signing-key
      MEDIA_STORE: filesystem
      MEDIA_ROOT: .media
      MEDIA_PUBLIC_BASE_URL: http://localhost:8000/media
    services:
      postgres:
        image: postgis/postgis:18-3.6
        env:
          POSTGRES_USER: serendipeak
          POSTGRES_PASSWORD: serendipeak
          POSTGRES_DB: serendipeak
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U serendipeak -d serendipeak"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5

      - name: Install GDAL and GEOS
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gdal-bin libgdal-dev libgeos-dev

      - uses: astral-sh/setup-uv@v7
        with:
          python-version-file: .python-version
          enable-cache: true
          cache-dependency-glob: services/api/uv.lock

      - name: Install dependencies
        run: uv sync --locked

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Django system checks
        run: uv run python manage.py check

      # Boots the settings, URL configuration and composition with production values and the S3
      # media store. Every value is a placeholder: `check` neither connects to the database nor
      # contacts the object store, and needs no catalog.
      - name: Django system checks (production settings)
        env:
          APP_ENV: production
          ALLOWED_HOSTS: api.example.com,healthcheck.railway.app
          CORS_ALLOWED_ORIGIN: https://web.example.com
          WEB_ORIGIN: https://web.example.com
          TRUSTED_PROXY_HOPS: "1"
          MEDIA_STORE: s3
          MEDIA_PUBLIC_BASE_URL: https://media.example.com
          MEDIA_S3_ENDPOINT_URL: https://objects.example.com
          MEDIA_S3_ACCESS_KEY_ID: ci-only-access-key-id
          MEDIA_S3_SECRET_ACCESS_KEY: ci-only-secret-access-key
          MEDIA_PUBLIC_BUCKET: ci-public
          MEDIA_ORIGINALS_BUCKET: ci-originals
        run: uv run python manage.py check

      - name: Check migrations are in sync
        run: uv run python manage.py makemigrations --check --dry-run

      - name: Apply migrations
        run: uv run python manage.py migrate --noinput

      - name: Test
        run: uv run pytest

  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Production gate
        run: npm run check:production-gate

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: SSR HTTP tests
        run: npm run test:ssr

      - name: Stage failure tests (no WebGL)
        run: npm run test:nogl

  scripts:
    name: Scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Test the CI, backup and offsite backup scripts
        run: node --test "scripts/*.test.mjs" "services/backup/test/*.test.mjs" "services/offsite-backup/test/*.test.mjs"
