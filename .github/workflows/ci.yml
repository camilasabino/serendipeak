name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commitlint:
    name: Commit messages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint pull request commits
        if: github.event_name == 'pull_request'
        run: npx --no -- commitlint --from "${{ github.event.pull_request.base.sha }}" --to "${{ github.event.pull_request.head.sha }}" --verbose

      - name: Lint pushed commits
        if: github.event_name == 'push'
        run: |
          before="${{ github.event.before }}"
          if git cat-file -e "${before}^{commit}" 2>/dev/null; then
            npx --no -- commitlint --from "$before" --to "${{ github.sha }}" --verbose
          else
            npx --no -- commitlint --last --verbose
          fi

  contracts:
    name: Contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Verify frozen contract integrity
        run: node scripts/contracts-verify.mjs

  api:
    name: API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    env:
      DATABASE_URL: postgres://serendipeak:serendipeak@localhost:5432/serendipeak
      APP_ENV: development
      DJANGO_SECRET_KEY: ci-only-insecure-secret-key
      ALLOWED_HOSTS: localhost,127.0.0.1
      CORS_ALLOWED_ORIGIN: http://localhost:3000
    services:
      postgres:
        image: postgis/postgis:18-3.6
        env:
          POSTGRES_USER: serendipeak
          POSTGRES_PASSWORD: serendipeak
          POSTGRES_DB: serendipeak
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U serendipeak -d serendipeak"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5

      - name: Install GDAL and GEOS
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gdal-bin libgdal-dev libgeos-dev

      - uses: astral-sh/setup-uv@v7
        with:
          python-version-file: .python-version
          enable-cache: true
          cache-dependency-glob: services/api/uv.lock

      - name: Install dependencies
        run: uv sync --locked

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Django system checks
        run: uv run python manage.py check

      - name: Check migrations are in sync
        run: uv run python manage.py makemigrations --check --dry-run

      - name: Apply migrations
        run: uv run python manage.py migrate --noinput

      - name: Bootstrap catalog
        run: uv run python manage.py bootstrap_catalog

      - name: Check catalog
        run: uv run python manage.py check_catalog

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Verify the live API against the frozen contract
        id: live-api
        env:
          APP_ENV: production
          API_BASE_URL: http://127.0.0.1:8000
        run: |
          uv run python manage.py runserver 127.0.0.1:8000 --noreload > "$RUNNER_TEMP/api.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2> /dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            curl --silent --fail "$API_BASE_URL/healthz" > /dev/null && break
            sleep 1
          done
          set +e
          # The CI database is discarded with the job, so persisting today's discovery is safe.
          node ../../contracts/v1/verify-api.mjs "$API_BASE_URL" --include-stateful-today 2> "$RUNNER_TEMP/verify-api.err"
          status=$?
          set -e
          cat "$RUNNER_TEMP/verify-api.err"
          # The random endpoint is not served yet: exactly its two checks may fail, nothing else.
          printf '%s\n' \
            "2 contract difference(s) against $API_BASE_URL:" \
            "- GET /api/v1/mountains/random: status 404, want 200" \
            "- GET /api/v1/mountains/random: Cache-Control is not no-store" \
            | diff - "$RUNNER_TEMP/verify-api.err"
          test "$status" -eq 1

      - name: Show the API server log
        if: failure() && steps.live-api.outcome == 'failure'
        run: cat "$RUNNER_TEMP/api.log"

      - name: Test
        run: uv run pytest

  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Production gate
        run: npm run check:production-gate
