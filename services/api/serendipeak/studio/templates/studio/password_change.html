{% extends "studio/base.html" %}
{% block title %}Change password{% endblock %}
{% block content %}
	<header class="page-header">
		<p class="kicker">Account</p>
		<h1 class="page-title">Change password</h1>
	</header>
	<section class="panel panel--narrow" aria-label="Change password">
		{% include "studio/components/error_summary.html" %}
		<form method="post" novalidate>
			{% csrf_token %}
			{% for field in form %}{% include "studio/components/field.html" %}{% endfor %}
			<div class="actions">
				<button class="button" type="submit">Change password</button>
				<a class="button button--quiet" href="{% url 'studio:landing' %}">Cancel</a>
			</div>
		</form>
	</section>
{% endblock %}
