[project]
name = "serendipeak-api"
version = "0.0.0"
description = "SerendiPeak Django API"
requires-python = ">=3.13,<3.14"
dependencies = [
    "django>=6.1.2,<6.2",
    "djangorestframework>=3.18.3,<3.19",
    "psycopg[binary]>=3.3.6,<3.4",
    "django-cors-headers>=4.9.0,<5",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1,<10",
    "pytest-django>=4.14.0,<5",
    "pyyaml>=6.0.3,<7",
    "ruff>=0.17.0,<0.18",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ"]

[tool.ruff.lint.per-file-ignores]
# Absent text is NULL, matching v1; CheckConstraints reject blank strings instead.
"serendipeak/persistence/models.py" = ["DJ001"]
