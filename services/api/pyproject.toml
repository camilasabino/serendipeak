[project]
name = "serendipeak-api"
version = "0.0.0"
description = "SerendiPeak Django API"
requires-python = ">=3.13,<3.14"
dependencies = [
    "django>=6.1.2,<6.2",
    "djangorestframework>=3.18.3,<3.19",
    "psycopg[binary]>=3.3.6,<3.4",
    "django-cors-headers>=4.9.0,<5",
    "pillow>=13.0.0,<14",
    "boto3>=1.43.123,<2",
    "gunicorn>=26.2.0,<27",
    "whitenoise>=6.12.0,<7",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1,<10",
    "pytest-django>=4.14.0,<5",
    "pyyaml>=6.0.3,<7",
    "ruff>=0.17.0,<0.18",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
testpaths = ["tests"]
# r2_smoke runs against real development buckets: only on demand, with pytest -m r2_smoke.
addopts = "-ra --strict-markers -m 'not r2_smoke'"
markers = [
    "r2_smoke: talks to the real development R2 buckets; needs MEDIA_STORE=s3 and credentials",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ"]

[tool.ruff.lint.per-file-ignores]
# Absent text is NULL, matching v1; CheckConstraints reject blank strings instead.
"serendipeak/persistence/models.py" = ["DJ001"]
